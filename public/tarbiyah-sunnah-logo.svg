    <path d="M106 0 L106 50 L192 142 C194 144 192 146 189 144.5 L106 63 Z" fill="#F0B21B" />
    
    <!-- Middle Orange Ray -->
    <path d="M63 26 L63 86 L195 180 C197 182 194.5 184 192 182.5 L63 100 Z" fill="#D47012" />
    
    <!-- Bottom Forest Green Shape -->
    <path d="M52 98 L194 196 C198 198.5 195 204 189 204 L52 204 Z" fill="#445E36" />
  </g>

  <!-- Typography -->
