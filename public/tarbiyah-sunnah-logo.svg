  <text x="160" y="290" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="52" fill="#445E36" letter-spacing="-1">Tarbiyah</text>
  
  <!-- "Sunnah" -->
  <text x="160" y="355" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="52" fill="#445E36" letter-spacing="-1">Sunnah</text>
</svg>
